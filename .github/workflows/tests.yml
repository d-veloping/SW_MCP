name: tests

on:
  workflow_dispatch:

jobs:
  offline:
    # pywin32 is a hard dependency and the COM surface these tests fake is
    # Windows', so a Linux runner could not even install the package.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The one version the server runs on and is checked live against
          # SOLIDWORKS with; requires-python says the same.
          python-version: "3.12"

      - name: Install the package
        run: python -m pip install .

      - name: Import the server module
        # The tests only reach sw_core, so nothing else here would notice an
        # incompatible mcp release breaking the server's own entry point --
        # which is exactly how mcp 2.0 slipped past a green build once.
        run: python -c "from solidworks_mcp import server; print(len(server.TOOLS), 'tools registered')"

      - name: Run the offline tests
        # discover only picks up test*.py, so live_p0_regression.py -- which
        # needs a running SOLIDWORKS -- is correctly left out here.
        run: python -m unittest discover -s tests -v

      - name: Check the package builds
        run: |
          python -m pip install build
          python -m build
